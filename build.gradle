plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.2.0'
group = 'com.taczenhancedpatch'
archivesBaseName = 'TACZEnhancedPatch'

/* 平台版本单源化: mappings 与 Forge 依赖共用 */
def mcVersion = '1.20.1'
def forgeVersion = '47.4.23'
def forgeMajor = '47'

/* 上游模组 TACZ: 依赖版本与 CurseForge 文件编号, 升级上游时同步修改 */
def taczVersion = '1.1.8-hotfix2'
def taczMinVersion = '1.1.8'
def taczCurseFileId = '9037989'

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version,
               'mcVersion': mcVersion,
               'forgeMajor': forgeMajor,
               'taczMinVersion': taczMinVersion
    }
    /* 遗迹建筑蓝图: 作者把 .schem 放在 src/main/ruins, 构建时原样并入资源包, 运行期由模组文件系统扫描并随机选取 */
    inputs.dir file('src/main/ruins')
    from('src/main/ruins') {
        include '*.schem'
        into 'assets/tacz_enhanced_patch/ruins'
    }
}

/*
 * 遗迹蓝图校验: 构建期检查 src/main/ruins 下的蓝图能否解析.
 * 内置只允许 .schem, 校验结果只告警不中断构建; 缺少 Python 时同样只告警.
 */
tasks.register('validateBlueprints') {
    group = 'verification'
    description = '校验 src/main/ruins 下的遗迹蓝图, 只告警'
    doLast {
        def blueprintDir = file('src/main/ruins')
        def blueprintFiles = blueprintDir.isDirectory() ? (blueprintDir.listFiles() ?: new File[0]) : new File[0]
        def blueprints = blueprintFiles.findAll { entry ->
            entry.isFile() && entry.name.toLowerCase(Locale.ROOT).endsWith('.schem')
        }
        if (blueprints.isEmpty()) {
            throw new GradleException("[blueprints] src/main/ruins 下没有 .schem 蓝图, 拒绝构建; 旧格式请先用 scripts/blueprints.py 转换")
        }
        def python = null
        for (String candidate : ['python', 'python3']) {
            try {
                def probe = project.providers.exec {
                    commandLine candidate, '--version'
                    ignoreExitValue = true
                    standardOutput = new ByteArrayOutputStream()
                    errorOutput = new ByteArrayOutputStream()
                }
                if (probe.result.get().exitValue == 0) {
                    python = candidate
                    break
                }
            } catch (Exception ignored) {
                /* 该候选不可用, 试下一个 */
            }
        }
        if (python == null) {
            logger.warn('[blueprints] 未找到可用的 Python, 跳过蓝图校验')
            return
        }
        def output = new ByteArrayOutputStream()
        def runner = project.providers.exec {
            commandLine python, 'scripts/blueprints.py', '--check', '--input', 'src/main/ruins'
            workingDir project.projectDir
            ignoreExitValue = true
            standardOutput = output
            errorOutput = output
        }
        runner.result.get()
        def text = output.toString('UTF-8')
        try {
            def report = new groovy.json.JsonSlurper().parseText(text.trim())
            if (report.ok) {
                logger.lifecycle("[blueprints] 蓝图校验通过, 共 ${report.summary.total} 个文件")
            } else {
                report.files.findAll { !it.valid }.each { item ->
                    logger.warn("[blueprints] ${item.path} 校验未通过: ${item.errors?.join('; ')}")
                }
                logger.warn('[blueprints] 蓝图校验未通过, 构建继续')
            }
        } catch (Exception ignored) {
            logger.warn('[blueprints] 蓝图校验输出无法解析, 构建继续')
            logger.warn(text.take(400))
        }
    }
}

processResources.dependsOn 'validateBlueprints'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
    maven {
        url 'https://maven.aliyun.com/repository/central'
    }
    maven {
        url 'https://repo.huaweicloud.com/repository/maven'
    }
    maven {
        url 'https://maven.minecraftforge.net/'
    }
    maven {
        url 'https://libraries.minecraft.net/'
    }
    maven {
        /* 上游模组 TACZ 的获取来源 */
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: mcVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            /* 上游模组 TACZ 使用 Mixin, 开发环境需要把 SRG 引用表重映射到运行时映射 */
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                tacz_enhanced_patch {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            /* 上游模组 TACZ 使用 Mixin, 开发环境需要把 SRG 引用表重映射到运行时映射 */
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                tacz_enhanced_patch {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"

    /* 上游模组只参与编译与开发运行, 不打包进产物, 由玩家自行安装 */
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:${taczCurseFileId}")
}

jar {
    /* 产物命名: TACZEnhancedPatch-v<版本>-mc-<Minecraft 版本>-forge.jar, v 前缀只用于文件名, 模组内版本保持纯数字 */
    archiveFileName = "TACZEnhancedPatch-v${project.version}-mc-${mcVersion}-forge.jar"
    manifest {
        attributes([
            "Specification-Title"     : "TACZ Enhanced Patch",
            "Specification-Vendor"    : "JularDepick",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "JularDepick",
            "TACZ-Version"            : taczVersion,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
