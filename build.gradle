plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'com.taczenhancedpatch'
archivesBaseName = 'TACZEnhancedPatch'

/* 平台版本单源化: mappings 与 Forge 依赖共用 */
def mcVersion = '1.20.1'
def forgeVersion = '47.4.23'
def forgeMajor = '47'

/* 上游模组 TACZ: 依赖版本与 CurseForge 文件编号, 升级上游时同步修改 */
def taczVersion = '1.1.8-hotfix2'
def taczMinVersion = '1.1.8'
def taczCurseFileId = '9037989'

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version,
               'mcVersion': mcVersion,
               'forgeMajor': forgeMajor,
               'taczMinVersion': taczMinVersion
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public'
    }
    maven {
        url 'https://maven.aliyun.com/repository/central'
    }
    maven {
        url 'https://repo.huaweicloud.com/repository/maven'
    }
    maven {
        url 'https://maven.minecraftforge.net/'
    }
    maven {
        url 'https://libraries.minecraft.net/'
    }
    maven {
        /* 上游模组 TACZ 的获取来源 */
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    mavenCentral()
}

minecraft {
    mappings channel: 'official', version: mcVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            /* 上游模组 TACZ 使用 Mixin, 开发环境需要把 SRG 引用表重映射到运行时映射 */
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                tacz_enhanced_patch {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            /* 上游模组 TACZ 使用 Mixin, 开发环境需要把 SRG 引用表重映射到运行时映射 */
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                tacz_enhanced_patch {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"

    /* 上游模组只参与编译与开发运行, 不打包进产物, 由玩家自行安装 */
    implementation fg.deobf("curse.maven:timeless-and-classics-zero-1028108:${taczCurseFileId}")
}

jar {
    /* 产物命名: TACZEnhancedPatch-v<版本>-mc-<Minecraft 版本>-forge.jar, v 前缀只用于文件名, 模组内版本保持纯数字 */
    archiveFileName = "TACZEnhancedPatch-v${project.version}-mc-${mcVersion}-forge.jar"
    manifest {
        attributes([
            "Specification-Title"     : "TACZ Enhanced Patch",
            "Specification-Vendor"    : "JularDepick",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "JularDepick",
            "TACZ-Version"            : taczVersion,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
